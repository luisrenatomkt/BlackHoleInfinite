name: Build mod

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
            unzip -q gradle-2.14.1-bin.zip -d "$HOME"
            echo "GRADLE_CMD=$HOME/gradle-2.14.1/bin/gradle" >> $GITHUB_ENV
          fi

      - name: Build jar
        run: $GRADLE_CMD setupCiWorkspace build --no-daemon --stacktrace

      - name: Upload jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleInfinite-jar
          path: build/libs/*.jar

      - name: Publish release (when pushing a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
